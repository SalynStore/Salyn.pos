<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salyn POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2545">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fbf4f5;--card:#fff;--ink:#2e1a2b;--mut:#7d6a79;--pl:#4a2545;--rose:#c8456b;--ok:#2f7d5b;--warn:#b7791f;--bad:#c0392b;--line:#ecdde1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{background:var(--pl);color:#fff;padding:14px 16px}
header b{font:700 20px Georgia,serif}
main{padding:14px;max-width:640px;margin:auto}
h2{font:700 20px Georgia,serif;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:14px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.ok{background:#e3f3ec;color:var(--ok)}.pronto{background:#fbf0d9;color:var(--warn)}.vencido{background:#fbe3e0;color:var(--bad)}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}
input,select{display:block;width:100%;font:inherit;color:var(--ink);padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:#fff}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;font:600 16px inherit;font-family:inherit;padding:12px;border:0;border-radius:10px;background:var(--rose);color:#fff;margin-top:6px}
.btn.ghost{background:#fff;color:var(--pl);border:1px solid var(--line)}
.btn.sm{width:auto;padding:6px 12px;font-size:14px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;white-space:nowrap;border:0;background:none;padding:12px 11px;font:13px inherit;font-family:inherit;color:var(--mut)}
nav button.on{color:var(--rose);font-weight:700;box-shadow:inset 0 3px 0 var(--rose)}
#m{display:none;position:fixed;inset:0;background:rgba(46,26,43,.5);z-index:5;overflow:auto}
#m.on{display:block}
.sheet{background:var(--bg);margin:30px auto;max-width:520px;border-radius:14px;padding:16px;width:calc(100% - 24px)}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pl);color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:9;font-size:15px;max-width:90%;text-align:center}
.big{font:700 22px Georgia,serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.lot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:14px;color:var(--mut)}
.code{font-family:ui-monospace,Menlo,monospace;background:#f3e6ea;color:var(--pl);padding:1px 6px;border-radius:6px;font-size:13px}
.pickbox{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 10px}
.pk{padding:10px;border-bottom:1px solid var(--line)}
.pk:last-child{border-bottom:0}
.pk.sel{background:#f9e3ea;box-shadow:inset 4px 0 0 var(--rose)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tk{background:var(--pl);color:#fbf3f0;border-radius:14px;padding:16px;margin-bottom:12px}
.tkl{font-size:13px;color:#ebd3d6}
.tkp{font:700 32px Georgia,serif;margin:4px 0}
.tks{font-size:14px;color:#ebd3d6;background:rgba(251,243,240,.1);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.tkb{display:flex;justify-content:space-between;border-top:1px dashed rgba(251,243,240,.3);padding-top:10px;font-size:13px;color:rgba(251,243,240,.7)}
.tkb b{display:block;color:#fbf3f0;font-size:15px}
.tkw{color:#fff;background:#7a1f1f;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px}
</style></head><body>
<header><b>Salyn Store</b> <span class="mut" style="color:#e9c9d6">· Inventario y ventas</span><span id="stt" onclick="retrySave()" style="float:right;font-size:13px;color:#e9c9d6;cursor:pointer"></span></header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s);
const CATS=['Skincare','Maquillaje','Mascarillas','Cremas','Pestañas','Perfumes','Uñas','Cabello','Accesorios','Otros'];
const UN={unidad:['unidad','unidades'],docena:['docena','docenas'],decena:['decena','decenas'],set:['set','sets'],box:['box','boxes']};
const REASONS=['Mala pigmentación','Producto malo','No apto para venta','Envase dañado o roto'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const un=(n,u)=>n+' '+(UN[u]||UN.unidad)[n==1?0:1];
let D={products:[],moves:[],cats:CATS.slice(),payments:[]},tab='productos',range='mes',q='',fc='';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nextCode=()=>{const n=D.products.reduce((m,p)=>{const x=/^SAL-(\d+)$/.exec(p.code||'');return x?Math.max(m,+x[1]):m},0)+1;return'SAL-'+String(n).padStart(4,'0')};
/* Ordena datos viejos: lotes, categorías, códigos y unidades */
function migrate(){
 if(!D.cats||!D.cats.length)D.cats=CATS.slice();
 if(!D.reasons||!D.reasons.length)D.reasons=REASONS.slice();
 if(!D.payments)D.payments=[];
 if(!D.sales)D.sales=[];
 if(!D.combos)D.combos=[];
 const yp=m=>/^Yape \d$/.test(m||'')?'Yape':m;
 D.moves.forEach(x=>{if(x.type==='out'&&!x.sid){x.sid=x.id;D.sales.push({id:x.id,date:x.date,method:yp(x.method)||'',paid:x.paid??x.qty*x.price,credit:!!x.credit,client:x.client||''})}});
 D.sales.forEach(z=>{z.method=yp(z.method)||''});D.payments.forEach(a=>{a.method=yp(a.method)});
 D.moves.forEach(x=>{if(x.type==='baja'){x.type='merma';x.reason=x.reason||'Vencido'}});
 D.products.forEach(p=>{
  if(!p.lots){p.lots=p.stock>0?[{id:uid(),date:'',exp:p.exp||'',qty:p.stock,cost:p.cost}]:[];delete p.stock;delete p.exp}
  if(!p.unit)p.unit='unidad';
  if(!p.code)p.code=nextCode();
  if(p.cat&&!D.cats.includes(p.cat))D.cats.push(p.cat);
 })}
migrate();
/* ---------- Nube (Firebase): entrar, guardar y sincronizar ---------- */
const OWNER='salyn0store@gmail.com';
let user=null,ready=false,synced={},unsubs=[],syncErr='',role='',isOwner=false,myName='',TEAM={};
const ADM=()=>role==='admin';
const COLS=['products','moves','sales','payments','combos'];
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const blank=()=>({products:[],moves:[],cats:CATS.slice(),reasons:REASONS.slice(),payments:[],sales:[],combos:[]});
function save(){
 if(!ready)return;const ops=[];
 COLS.forEach(c=>{const seen={};
  D[c].forEach(x=>{const k=c+'/'+x.id,j=canon(x);seen[k]=1;if(synced[k]!==j){synced[k]=j;ops.push({col:c,id:x.id,data:JSON.parse(j)})}});
  Object.keys(synced).forEach(k=>{if(k.startsWith(c+'/')&&!seen[k]){delete synced[k];ops.push({col:c,id:k.slice(c.length+1),del:true})}})});
 const m=canon({cats:D.cats,reasons:D.reasons});
 if(synced['config/main']!==m){synced['config/main']=m;ops.push({col:'config',id:'main',data:{cats:D.cats,reasons:D.reasons}})}
 if(ops.length)FB.write(ops).then(()=>{if(syncErr){syncErr='';updStatus()}}).catch(e=>{syncErr=e.code||e.message||'error';ops.forEach(o=>{delete synced[o.col+'/'+o.id]});updStatus();toast('⚠ No se guardó en la nube: '+syncErr,6000)})}
function retrySave(){if(!ready)return;syncErr='';save();updStatus();toast('Reintentando guardar…')}
function normalize(){COLS.forEach(c=>D[c].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0))}
function onSnap(col,snap){let ch=false;
 snap.docChanges().forEach(c=>{const id=c.doc.id,k=col+'/'+id;
  if(col==='config'){if(c.type!=='removed'){const d=c.doc.data();D.cats=d.cats||D.cats;D.reasons=d.reasons||D.reasons;synced[k]=canon({cats:D.cats,reasons:D.reasons});ch=true}return}
  if(c.type==='removed'){D[col]=D[col].filter(x=>x.id!==id);delete synced[k];ch=true}
  else{const d=c.doc.data();d.id=id;const i=D[col].findIndex(x=>x.id===id);if(i>=0)D[col][i]=d;else D[col].push(d);synced[k]=canon(d);ch=true}});
 if(ch){normalize();if(ready)softRender()}}
function softRender(){const a=document.activeElement;
 if($('#m').className==='on'||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName||'')))return;render()}
function updStatus(){const e=$('#stt');if(!ready){e.textContent='';return}
 e.textContent=syncErr?'⚠ No se guardó · toca para reintentar':(navigator.onLine?'● En línea':'● Sin internet (se guarda y sube al volver)')+' · '+myName}
function showLogin(msg){$('#nav').style.display='none';$('#stt').textContent='';
 $('#v').innerHTML=`<h2>Entrar</h2><div class="card"><form onsubmit="return doLogin(event)">
 <label>Correo<input name="e" type="email" required autocomplete="username" value="${esc(localStorage.getItem('salyn_email')||'')}"></label>
 <label>Contraseña<input name="p" type="password" required autocomplete="current-password"></label>
 <button class="btn">Entrar</button></form><p class="mut" style="margin-top:12px"><a href="#" onclick="forgot();return false">Olvidé mi contraseña</a></p>${msg?`<p style="color:var(--bad)">${esc(msg)}</p>`:''}</div>`}
const authMsg=e=>({'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin internet. Revisa tu conexión.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/invalid-email':'Ese correo no es válido.'})[e.code]||'No se pudo entrar: '+(e.code||e.message);
async function doLogin(e){e.preventDefault();const f=new FormData(e.target);
 try{await FB.login(f.get('e').trim(),f.get('p'));try{localStorage.setItem('salyn_email',f.get('e').trim())}catch(x){}}catch(err){showLogin(authMsg(err))}return false}
function forgot(){const em=($('input[name=e]').value||'').trim();if(!em){toast('Escribe tu correo arriba y vuelve a tocar');return}
 FB.reset(em).then(()=>toast('Te enviamos un correo para cambiar la contraseña (revisa también Spam)',5000)).catch(e=>toast(authMsg(e)))}
function stopSync(){unsubs.forEach(f=>f());unsubs=[];ready=false;synced={};D=blank();cart=[];pd={};role='';isOwner=false;myName='';TEAM={}}
async function startSync(){
 $('#v').innerHTML='<div class="empty">Cargando tus datos…</div>';
 stopSync();
 const em=(user.email||'').toLowerCase();
 if(em===OWNER){role='admin';isOwner=true;myName='Dueña'}
 else{let t=null;
  try{t=await FB.getDoc('team',em)}catch(e){showNoAccess('No se pudo verificar tu acceso. Revisa tu internet e inténtalo de nuevo.',true);return}
  if(!t||!['admin','vendedor'].includes(t.role)){showNoAccess('Tu correo no tiene acceso a esta tienda. Pídele a la dueña que te agregue en la pestaña Equipo.');return}
  role=t.role;myName=t.name||em.split('@')[0]}
 const firsts=[...COLS,'config'].map(col=>new Promise(res=>{let done=false;
  unsubs.push(FB.listen(col,snap=>{onSnap(col,snap);if(!done&&(!snap.metadata.fromCache||!navigator.onLine||snap.size>0)){done=true;res()}},
   err=>{res();toast('No se pudo leer '+col+': '+(err.code||''))}))}));
 if(isOwner)unsubs.push(FB.listen('team',snap=>{snap.docChanges().forEach(c=>{if(c.type==='removed')delete TEAM[c.doc.id];else TEAM[c.doc.id]=c.doc.data()});if(ready&&tab==='equipo')softRender()},()=>{}));
 await Promise.race([Promise.all(firsts),new Promise(r=>setTimeout(r,8000))]);
 normalize();
 if(!synced['config/main'])synced['config/main']=canon({cats:D.cats,reasons:D.reasons});
 ready=true;$('#nav').style.display='flex';updStatus();
 const loc=localStorage.getItem('salynpos');
 if(loc&&ADM()&&!D.products.length&&!D.moves.length){try{const d=JSON.parse(loc);if(d.products&&d.products.length)offerImport(d)}catch(e){}}
 tab=ADM()?'productos':'vender';migrate();save();render()}
function offerImport(d){
 modal(`<h2>Encontré datos en este aparato</h2><p>Hay ${d.products.length} producto(s) y ${(d.moves||[]).length} movimiento(s) guardados solo aquí. ¿Los subo a la nube para verlos en todos tus aparatos?</p>
 <button class="btn" onclick="doImport()">Sí, subirlos</button><button class="btn ghost" onclick="closeM()">No, empezar vacío</button>`);window._imp=d}
function doImport(){D=window._imp;migrate();save();try{localStorage.setItem('salynpos_subido',localStorage.getItem('salynpos'));localStorage.removeItem('salynpos')}catch(e){}
 closeM();render();toast('Datos subidos a la nube')}
function boot(){FB.onAuth(u=>{if(u){user=u;startSync()}else{stopSync();showLogin()}})}
/* ---------- Exportar a Excel ---------- */
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res();const t=document.createElement('script');
 t.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';t.onload=res;t.onerror=()=>rej(new Error('x'));document.head.appendChild(t)})}
async function exportXlsx(){
 try{await loadXlsx()}catch(e){toast('No se pudo cargar el exportador. Revisa tu internet.');return}
 const W=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(W,XLSX.utils.json_to_sheet(r.length?r:[{'(sin datos)':''}]),n);
 add('Productos',D.products.map(p=>({'Código':p.code,Producto:p.name,'Categoría':p.cat,'Presentación':p.unit,Costo:p.cost,'Precio venta':p.price,Stock:stock(p),'Avisar si quedan ≤':p.min})));
 add('Lotes',D.products.flatMap(p=>p.lots.map(l=>({'Código':p.code,Producto:p.name,Cantidad:l.qty,'Costo por unidad':l.cost,'Fecha entrega':l.date,Vencimiento:l.exp}))));
 add('Ventas',D.sales.map(z=>({Fecha:z.date,Cliente:z.client,'Forma de pago':z.method||'Sin dato',Productos:sLines(z.id).map(x=>x.name+' ×'+x.qty).join(', '),Total:saleTotal(z.id),'Pagó al vender':z.paid,'A crédito':z.credit?'Sí':'No'})));
 add('Detalle ventas',D.moves.filter(x=>x.type==='out').map(x=>({Fecha:x.date,Producto:x.name,Cantidad:x.qty,Precio:x.price,Costo:x.cost,Combo:x.combo||'',Ganancia:x.qty*(x.price-x.cost)})));
 add('Pagos de deudas',D.payments.map(a=>{const z=S(a.mid);return{Fecha:a.date,Cliente:z?z.client:'',Monto:a.amount,'Forma de pago':a.method}}));
 add('Entradas',D.moves.filter(x=>x.type==='in').map(x=>({Fecha:x.date,Producto:x.name,Cantidad:x.qty,Costo:x.cost})));
 add('Mermas',D.moves.filter(x=>x.type==='merma').map(x=>({Fecha:x.date,Producto:x.name,Cantidad:x.qty,Costo:x.cost,'Pérdida':x.qty*x.cost,Motivo:x.reason||'Vencido',Nota:x.note||''})));
 add('Inventario',D.products.map(p=>({'Código':p.code,Producto:p.name,'Categoría':p.cat,'Presentación':p.unit,Stock:stock(p),'Avisar si quedan ≤':p.min,'Costo total en stock':invVal(p),'Precio de venta':p.price,'Valor a precio de venta':stock(p)*p.price,'Vence primero':nextExp(p)})));
 add('Ajustes de stock',D.moves.filter(x=>x.type==='ajuste').map(x=>({Fecha:x.date,Producto:x.name,Diferencia:x.qty,Costo:x.cost,Motivo:x.reason||'',Nota:x.note||'','Quién':x.by||''})));
 XLSX.writeFile(W,'salyn-pos-'+today()+'.xlsx')}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'S/ '+(+n||0).toFixed(2);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
range=today().slice(0,7);
let cart=[],pd={},vsq='',vsel='';
const fd=d=>d?d.split('-').reverse().join('/'):'';
const days=e=>Math.round((new Date(e+'T00:00')-new Date(today()+'T00:00'))/864e5);
const P=id=>D.products.find(x=>x.id===id);
const mv=(type,p,qty,cost,price)=>({id:uid(),date:today(),type,pid:p.id,name:p.name,unit:p.unit,qty,cost,price});
const ord=(a,b)=>(a.exp||'9999')<(b.exp||'9999')?-1:(a.exp||'9999')>(b.exp||'9999')?1:(a.date||'')<(b.date||'')?-1:1;
const stock=p=>p.lots.reduce((s,l)=>s+l.qty,0);
const sellable=p=>p.lots.filter(l=>!l.exp||l.exp>=today()).reduce((s,l)=>s+l.qty,0);
function ls(l){if(!l.exp)return'ok';const d=days(l.exp);return d<0?'vencido':d<=30?'pronto':'ok'}
function st(p){const s=p.lots.map(ls);return s.includes('vencido')?'vencido':s.includes('pronto')?'pronto':'ok'}
function nextExp(p){const l=p.lots.filter(l=>l.exp).sort(ord)[0];return l?l.exp:''}
function toast(s,ms){const t=$('#t');t.textContent=s;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',ms||2600)}
function modal(h){$('#m').innerHTML='<div class="sheet">'+h+'</div>';$('#m').className='on'}
function closeM(){$('#m').className=''}
function go(t){tab=t;render()}
const opts=(list,f)=>list.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.code} (${un(f(p),p.unit)})</option>`).join('');
const lotTxt=(l,p)=>`${un(l.qty,p.unit)} · entró ${l.date?fd(l.date):'sin fecha'} · ${l.exp?'vence '+fd(l.exp):'sin vencimiento'}`;
const catOpts=cur=>D.cats.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new">➕ Crear categoría nueva…</option>';
const unitOpts=cur=>Object.keys(UN).map(u=>`<option value="${u}" ${u===cur?'selected':''}>${cap(u)}</option>`).join('');

/* ---------- Categorías ---------- */
function ask(t,d){return(prompt(t,d||'')||'').trim()}
function catSel(v){if(v!=='__new')return;const sel=$('#cs'),n=ask('Nombre de la nueva categoría');
 if(!n){sel.value=D.cats[0]||'';return}
 let c=D.cats.find(x=>x.toLowerCase()===n.toLowerCase());if(!c){c=n;D.cats.push(c);save()}
 sel.innerHTML=catOpts(c);sel.value=c}
function catForm(){modal(`<h2>Categorías</h2>`+D.cats.map((c,i)=>{const n=D.products.filter(p=>p.cat===c).length;
 return `<div class="card row"><div><b>${esc(c)}</b><div class="mut">${n} producto${n==1?'':'s'}</div></div>
 <div style="display:flex;gap:6px"><button class="btn sm ghost" onclick="renCat(${i})">Renombrar</button>${n?'':`<button class="btn sm ghost" onclick="delCat(${i})">Quitar</button>`}</div></div>`}).join('')+
 `<button class="btn" onclick="addCat()">+ Nueva categoría</button><button class="btn ghost" onclick="closeM()">Cerrar</button>`)}
function addCat(){const n=ask('Nombre de la nueva categoría');if(!n)return;
 if(D.cats.some(c=>c.toLowerCase()===n.toLowerCase()))return toast('Esa categoría ya existe');
 D.cats.push(n);save();catForm();render()}
function renCat(i){const o=D.cats[i],n=ask('Nuevo nombre',o);if(!n||n===o)return;
 if(D.cats.some((c,j)=>j!==i&&c.toLowerCase()===n.toLowerCase()))return toast('Esa categoría ya existe');
 D.cats[i]=n;D.products.forEach(p=>{if(p.cat===o)p.cat=n});if(fc===o)fc=n;save();catForm();render()}
function delCat(i){if(D.cats.length<2)return toast('Debe quedar al menos una categoría');
 if(confirm('¿Quitar la categoría '+D.cats[i]+'?')){if(fc===D.cats[i])fc='';D.cats.splice(i,1);save();catForm();render()}}

/* ---------- Productos ---------- */
function vProd(){
  const ql=q.toLowerCase(),l=D.products.filter(p=>(p.name.toLowerCase().includes(ql)||p.code.toLowerCase().includes(ql))&&(!fc||p.cat===fc));
  return `<h2>Productos</h2>
  <input placeholder="Buscar por nombre o código" value="${esc(q)}" oninput="q=this.value;render(true)" id="s">
  <div class="r2" style="margin-top:10px">
   <select onchange="fc=this.value;render()" style="margin:0"><option value="">Todas las categorías</option>${D.cats.map(c=>`<option ${c===fc?'selected':''}>${esc(c)}</option>`).join('')}</select>
   ${ADM()?'<button class="btn ghost" style="margin:0;padding:10px" onclick="catForm()">Editar categorías</button>':'<span></span>'}</div>

function savP(e,id){e.preventDefault();const f=new FormData(e.target),code=f.get('k').trim();

function inCalc(){const v=id=>$(id).value,pa=+v('#ipa')||0,en=+v('#ien')||0,ta=+v('#ita')||0,t=Math.max(1,Math.round(ta)||1);
 $('#icr').textContent=money(costoReal(v('#ic'),v('#iem'),pa,en,ta));
 $('#icd').textContent=(pa+en)>0&&ta<1?'⚠ Escribe cuántas unidades tiene la tanda':'Producto '+money(+v('#ic')||0)+' + empaque '+money(+v('#iem')||0)+' + pasaje y envío '+money((pa+en)/t)}

 if(!p||!n)return false;
 if((pa+en)>0&&ta<1){toast('Escribe cuántas unidades tiene la tanda para repartir el pasaje y el envío');return false}
 const c=costoReal(base,em,pa,en,ta||1);
 p.lots.push({id:uid(),date:f.get('d'),exp:f.get('x'),qty:n,cost:c,cbase:base,emp:em,extra:Math.round((pa+en)/(ta||1)*10000)/10000});
 p.cost=c;p.cbase=base;p.emp=em;etd={ta:ta?String(ta):'',pa:pa?String(pa):'',en:en?String(en):''};
 D.moves.push(Object.assign(mv('in',p,n,c,p.price),{date:f.get('d')}));

function pickList(){const q=vsq.toLowerCase();
 return D.products.filter(p=>sellable(p)-cartQty(p.id)>0&&(!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)))}
function pickHTML(l){return l.length?l.map(p=>`<div class="pk ${p.id===vsel?'sel':''}" onclick="pickP('${p.id}')"><div class="row"><b>${esc(p.name)}</b><span class="code">${esc(p.code)}</span></div><div class="mut">${un(sellable(p)-cartQty(p.id),p.unit)} disponibles · ${money(p.price)}</div></div>`).join(''):'<div class="empty" style="padding:12px">No encontré ese producto.</div>'}

function tot(){const t=cartTotal(),cr=$('#cr').checked,pg=+$('#pg').value||0,ds=+$('#ds').value||0,d=Math.min(t,$('#dt').value==='P'?t*Math.min(ds,100)/100:ds),n=t-d;
 $('#crb').style.display=cr?'block':'none';$('#tt').textContent=money(n);

function addCart(e){e.preventDefault();const f=new FormData(e.target),p=P(f.get('p')),n=+f.get('q'),c=+f.get('c');
 if(!p){toast('Toca un producto de la lista para elegirlo');return false}if(!n)return false;const av=sellable(p)-cartQty(p.id);

function doSell(e){e.preventDefault();const f=new FormData(e.target);
 const cr=f.get('cr')==='on',cl=(f.get('cl')||'').trim(),dt=f.get('d')||today();
 if(!cart.length)return false;
 if(dt<'2025-09-01'||dt>today()){toast('La fecha debe ser desde el 01/09/2025 hasta hoy');return false}

 for(const c of cart){const p=P(c.pid);if(!p||cartQty(c.pid)>sellable(p)){toast('Ya no hay stock suficiente de '+(p?p.name:'un producto'));return false}}
 const sid=uid(),gross=cartTotal(),dsv=+f.get('ds')||0,disc=Math.min(gross,f.get('dt')==='P'?gross*Math.min(dsv,100)/100:dsv),total=gross-disc,fac=gross>0?total/gross:1;
 cart.forEach(c=>{const p=P(c.pid);let need=c.qty,cost=0;const used=[];
  for(const l of p.lots.filter(l=>l.qty>0&&(!l.exp||l.exp>=today())).sort(ord)){if(!need)break;const t=Math.min(l.qty,need);l.qty-=t;need-=t;cost+=t*l.cost;used.push({id:l.id,date:l.date,exp:l.exp,cost:l.cost,qty:t})}
  p.lots=p.lots.filter(l=>l.qty>0);
  D.moves.push(Object.assign(mv('out',p,c.qty,cost/c.qty,c.price*fac),{date:dt,sid,lots:used,combo:c.combo||''}))});
 const paid=cr?Math.min(Math.max(+f.get('pg')||0,0),total):total,debe=total-paid;
 D.sales.push({id:sid,date:dt,method:f.get('m'),paid,credit:cr&&debe>0.005,client:cl,by:myName,disc:Math.round(disc*100)/100});
 const rest=[...new Set(cart.map(c=>c.pid))].map(id=>{const q=P(id);return q?q.name+': quedan '+un(stock(q),q.unit):''}).filter(Boolean).join(' · ');
 cart=[];pd={};vsq='';vsel='';save();toast((debe>0.005?'Venta a crédito: debe '+money(debe):'Venta registrada: '+money(total))+' — Inventario descontado ('+rest+')',6000);render();return false}

 (ADM()?`<h3>Corregir datos</h3><form onsubmit="return editSale(event,'${id}')">

 <button class="btn">Guardar cambios</button></form>
 <button class="btn ghost" style="color:var(--bad)" onclick="voidSale('${id}')">Anular venta</button>`:'')+
 `<button class="btn ghost" onclick="closeM()">Cerrar</button>`+

function payForm(id){const d=debts().find(z=>z.s.id===id);if(!d)return;const hist=D.payments.filter(a=>a.mid===id);
 modal(`<h2>Cobrar a ${esc(d.s.client)}</h2><p class="mut">${lineTxt(id)} · Debe ${money(d.debe)}</p>

let iq='',ic='',ie='',iso='nombre';
const AJ=['Conteo físico','Error de registro','Pérdida o robo','Otro'];
const pMin=p=>p.min??3;
const invVal=p=>p.lots.reduce((t,l)=>t+l.qty*l.cost,0);
function invEstado(p){const q=stock(p);return q===0?'cero':q<=pMin(p)?'bajo':st(p)==='pronto'?'vencer':'ok'}
function invList(){const q=iq.toLowerCase();
 const l=D.products.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q))&&(!ic||p.cat===ic)&&
  (!ie||(ie==='cero'?stock(p)===0:ie==='bajo'?(stock(p)>0&&stock(p)<=pMin(p)):st(p)==='pronto')));
 const ex=p=>nextExp(p)||'9999';
 const k={nombre:(a,b)=>a.name.localeCompare(b.name),stock:(a,b)=>stock(a)-stock(b)||a.name.localeCompare(b.name),valor:(a,b)=>invVal(b)-invVal(a),vence:(a,b)=>ex(a)<ex(b)?-1:ex(a)>ex(b)?1:0};
 return l.sort(k[iso]||k.nombre)}
function invCard(p){const e=invEstado(p),q=stock(p);
 const pill=e==='cero'?['vencido','Sin stock']:e==='bajo'?['pronto','Stock bajo']:e==='vencer'?['pronto','Por vencer']:['ok','Bien'];
 return `<div class="card" onclick="invForm('${p.id}')"><div class="row"><div><b>${esc(p.name)}</b> <span class="code">${esc(p.code)}</span><div class="mut">${esc(p.cat)}</div></div>
 <div style="text-align:right"><div class="big">${un(q,p.unit)}</div><span class="pill ${pill[0]}">${pill[1]}</span></div></div>
 <div class="mut" style="margin-top:6px">${nextExp(p)?'Vence primero: '+fd(nextExp(p))+' · ':''}${p.lots.length} lote${p.lots.length==1?'':'s'}${ADM()?' · Costo '+money(invVal(p))+' · Venta '+money(q*p.price):''}</div></div>`}

 const cero=l.filter(p=>stock(p)===0).length,bajo=l.filter(p=>stock(p)>0&&stock(p)<=pMin(p)).length,venc=l.filter(p=>st(p)==='pronto').length;

 ${ADM()?`<div class="card"><div class="mut">Invertido en stock (a costo)</div><div class="big">${money(cost)}</div></div>
 <div class="card"><div class="mut">Valor a precio de venta</div><div class="big" style="color:var(--ok)">${money(val)}</div></div>`:''}</div>`+

function doAjuste(e,pid){e.preventDefault();const f=new FormData(e.target),p=P(pid),l=p&&p.lots.find(x=>x.id===f.get('l')),real=+f.get('q'),dt=f.get('d')||today();
 if(!l||isNaN(real)||real<0)return false;

function preM(v){prm=String(v);$('#prm').value=prm;preCalc()}
function preCalc(){$('#pre').innerHTML=preHTML()}
function preUse(v){const p=P(prp);if(!p){toast('Primero elige un producto arriba');return}
 p.price=v;save();toast('Precio de '+p.name+' actualizado a '+money(v));preCalc()}
function preHTML(){const c=+prc||0,m=+prm||0,mn=pmin(),p=P(prp);
 if(c<=0)return '<div class="empty">Elige un producto o escribe el costo para ver los precios.</div>';
 const pm=c*(1+m/100),gm=pm-c,mr=pm>0?gm/pm*100:0,low=mn>0&&mr<mn;
 const use=v=>p?`<button class="btn" style="margin-top:10px" onclick="preUse(${v})">Usar ${money(v)} para ${esc(p.name)}</button>`:'';
 let h=`<div class="tk"><div class="tkl">Sumando ${m}% al costo (markup)</div><div class="tkp">${money(pm)}</div>
  <div class="tks">Redondeado a S/ 0.10: <b>${money(r1(pm))}</b></div>
  <div class="tkb"><div>Ganancia<b>${money(gm)}</b></div><div>Margen real<b style="color:${low?'#ff9d9d':'inherit'}">${pc1(mr)}</b></div></div>
  ${low?`<div class="tkw">⚠ Tu margen real (${pc1(mr)}) está por debajo de tu mínimo (${mn}%)</div>`:''}${use(r1(pm))}</div>`;
 if(m<100){const pg=c/(1-m/100),gg=pg-c,mk=gg/c*100;
  h+=`<div class="tk"><div class="tkl">El ${m}% es lo que queda del precio (margen)</div><div class="tkp">${money(pg)}</div>
  <div class="tks">Redondeado a S/ 0.10: <b>${money(r1(pg))}</b></div>
  <div class="tkb"><div>Ganancia<b>${money(gg)}</b></div><div>Sobre el costo<b>${pc1(mk)}</b></div></div>${use(r1(pg))}</div>`}
 else h+=`<div class="card mut">El método por margen no aplica a 100% o más.</div>`;
 h+=`<div class="card"><b>Escenarios</b><div class="mut" style="margin-bottom:8px">Mismo costo, tres márgenes (sobre el costo)</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">`+
  [['Conservador',Math.max(0,m-10)],['Estándar',m],['Agresivo',m+10]].map(([n,x])=>{const q=c*(1+x/100);
   return `<div class="card" style="margin:0;text-align:center"><div class="mut">${n}</div><b>${x}%</b><div class="big" style="font-size:17px">${money(q)}</div><div class="mut">gana ${money(q-c)}</div></div>`}).join('')+`</div></div>`;
 const cp=+pcp||0;
 if(cp>0){const d=r1(pm)-cp,ad=Math.abs(d),pp=ad/cp*100;
  h+=`<div class="card"><b>Frente a la competencia</b><div style="margin-top:6px">${ad<0.05?'Estás igual que la competencia.':d>0?`Estás <b>${money(ad)} más caro</b> (${pc1(pp)} por encima de ${money(cp)}).`:`Estás <b>${money(ad)} más barato</b> (${pc1(pp)} por debajo de ${money(cp)}): hay espacio para subir el precio.`}</div></div>`}
 if(p)h+=`<div class="card mut">Precio actual de ${esc(p.name)}: <b>${money(p.price)}</b> · margen real ${p.price>0?pc1((p.price-c)/p.price*100):'—'}</div>`;
 return h}

/* ---------- Combos y packs ---------- */
let cbn='',cbi=[],cbe='',cbm='30',cbp='',cbid='';
const cmbMax=c=>c.items.length?Math.max(0,Math.min(...c.items.map(i=>{const p=P(i.pid);return p?Math.floor((sellable(p)-cartQty(p.id))/i.qty):0}))):0;
const cmbTxt=c=>c.items.map(i=>{const p=P(i.pid);return p?esc(p.name)+' ×'+i.qty:'(producto borrado)'}).join(', ');
function cmbSell(){if(!D.combos.length)return'';
 return `<div class="card"><b>Combos</b><div class="mut" style="margin-bottom:6px">Toca para agregarlos a la venta actual</div>`+
 D.combos.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const k=D.products.find(p=>p.kit===c.id),kq=k?sellable(k)-cartQty(k.id):0,mx=cmbMax(c);
  return `<div class="lot" style="align-items:flex-start"><span><b>${esc(c.name)}</b> · ${money(c.price)}<br><span class="mut">${cmbTxt(c)}</span></span>
  <span style="display:flex;flex-direction:column;gap:6px"><button class="btn sm ${mx>0?'':'ghost'}" onclick="addComboLoose('${c.id}')">+ Armar ahora${mx>0?'':' (falta stock)'}</button>${kq>0?`<button class="btn sm ghost" onclick="addKit('${k.id}','${c.id}')">+ Ya armado (${kq})</button>`:''}</span></div>`}).join('')+`</div>`}
function addComboLoose(cid){const c=D.combos.find(x=>x.id===cid);if(!c)return;
 const ls2=c.items.map(it=>({p:P(it.pid),q:it.qty}));
 if(ls2.some(x=>!x.p||sellable(x.p)-cartQty(x.p.id)<x.q)){toast('No alcanza el stock para este combo');return}
 const reg=ls2.reduce((t,x)=>t+x.q*x.p.price,0),g=uid();let acc=0;
 ls2.forEach((x,i)=>{const last=i===ls2.length-1,tot2=last?Math.round((c.price-acc)*100)/100:Math.round(c.price*(reg>0?x.q*x.p.price/reg:1/ls2.length)*100)/100;
  acc+=tot2;cart.push({pid:x.p.id,qty:x.q,price:tot2/x.q,combo:c.name,g})});
 render();toast('Combo agregado: '+c.name+' · '+money(c.price))}
function addKit(kid,cid){const k=P(kid),c=D.combos.find(x=>x.id===cid);if(!k||!c)return;
 if(sellable(k)-cartQty(kid)<1){toast('No quedan combos armados');return}
 cart.push({pid:kid,qty:1,price:c.price});render();toast('Combo armado agregado: '+c.name)}
function cmbCalc(){const its=cbi.map(i=>({p:P(i.pid),q:i.qty})).filter(x=>x.p);
 const cost=its.reduce((t,x)=>t+x.q*x.p.cost,0)+(+cbe||0),reg=its.reduce((t,x)=>t+x.q*x.p.price,0),m=+cbm||0;
 return{its,cost,reg,m,pm:cost*(1+m/100)}}
function cmbRes(){const r=cmbCalc();if(!r.its.length)return'<div class="empty">Agrega productos al combo para ver los precios.</div>';
 const mn=pmin(),pr=+cbp||0,gp=pr-r.cost,mr=pr>0?gp/pr*100:0,mrs=r.pm>0?(r.pm-r.cost)/r.pm*100:0,low=mn>0&&pr>0&&mr<mn,ah=r.reg-pr;
 return `<div class="tk"><div class="tkl">Costo total del combo: ${money(r.cost)}</div><div class="tkp">${money(r.pm)}</div>
  <div class="tks">Precio sugerido (+${r.m}% sobre el costo). Redondeado: <b>${money(r1(r.pm))}</b> · margen ${pc1(mrs)}</div>
  <button class="btn" onclick="cmbUse(${r1(r.pm)})">Usar ${money(r1(r.pm))} como precio del combo</button></div>
 <div class="card"><b>Con el precio final que pongas abajo</b>`+(pr>0?`
  <div class="row" style="margin-top:6px"><span>Ganancia</span><b style="color:${gp>=0?'var(--ok)':'var(--bad)'}">${money(gp)}</b></div>
  <div class="row"><span>Margen real</span><b style="color:${low?'var(--bad)':'inherit'}">${pc1(mr)}</b></div>
  <div class="row"><span>Comprando suelto pagaría</span><b>${money(r.reg)}</b></div>
  <div class="row"><span>La clienta ahorra</span><b>${ah>0?money(ah)+' ('+pc1(ah/r.reg*100)+')':'nada (el combo sale más caro)'}</b></div>
  ${low?`<div class="tkw">⚠ Margen por debajo de tu mínimo (${mn}%)</div>`:''}${gp<0?'<div class="tkw">⚠ Estás vendiendo por debajo del costo</div>':''}`:'<div class="mut">Escribe el precio final del combo.</div>')+`</div>`}
function cmbItems(){return cbi.length?cbi.map((i,n)=>{const p=P(i.pid);return `<div class="lot"><span>${esc(p?p.name:'?')} ×${i.qty}${p?' · costo '+money(p.cost*i.qty):''}</span><button class="btn sm ghost" onclick="cmbRm(${n})">Quitar</button></div>`}).join(''):'<div class="mut" style="margin-bottom:8px">Todavía no agregaste productos.</div>'}
function cmbCalcUI(){$('#cbr').innerHTML=cmbRes();$('#cbl').innerHTML=cmbItems()}
function cmbAdd(){const pid=$('#cbs').value,q=Math.max(1,Math.round(+$('#cbq').value)||1);if(!pid)return;
 const e=cbi.find(i=>i.pid===pid);if(e)e.qty+=q;else cbi.push({pid,qty:q});cmbCalcUI()}
function cmbRm(n){cbi.splice(n,1);cmbCalcUI()}
function cmbUse(v){cbp=String(v);$('#cbp').value=cbp;cmbCalcUI()}
function cmbReset(){cbn='';cbi=[];cbe='';cbm='30';cbp='';cbid='';render()}
function cmbEdit(id){const c=D.combos.find(x=>x.id===id);if(!c)return;
 cbid=id;cbn=c.name;cbi=c.items.map(i=>({pid:i.pid,qty:i.qty}));cbe=c.emp?String(c.emp):'';cbm=String(c.margin??30);cbp=String(c.price);render();window.scrollTo(0,document.body.scrollHeight)}
function cmbSave(){const name=cbn.trim(),pr=+cbp||0;
 if(!name){toast('Ponle un nombre al combo');return}if(!cbi.length){toast('Agrega al menos un producto');return}if(pr<=0){toast('Escribe el precio final del combo');return}
 if(D.combos.some(c=>c.id!==cbid&&c.name.toLowerCase()===name.toLowerCase())){toast('Ya existe un combo con ese nombre');return}
 const o={name,items:cbi.map(i=>({pid:i.pid,qty:i.qty})),emp:+cbe||0,margin:+cbm||0,price:pr};
 let cid=cbid;if(cid)Object.assign(D.combos.find(c=>c.id===cid),o);else{cid=uid();D.combos.push(Object.assign({id:cid},o))}
 const k=D.products.find(x=>x.kit===cid);if(k){k.price=pr;k.name=name}
 save();toast('Combo guardado');cmbReset()}
function cmbDel(id){const c=D.combos.find(x=>x.id===id);if(!c||!confirm('¿Eliminar el combo '+c.name+'? Los armados que tengas en stock se quedan como producto.'))return;
 D.combos=D.combos.filter(x=>x.id!==id);save();render()}
function vCmb(){
 const list=D.combos.slice().sort((a,b)=>a.name.localeCompare(b.name));
 return `<h2>Combos y packs</h2>`+
 (list.length?list.map(c=>{const cost=c.items.reduce((t,i)=>{const p=P(i.pid);return t+(p?i.qty*p.cost:0)},0)+(+c.emp||0),k=D.products.find(p=>p.kit===c.id),mx=cmbMax(c);
  return `<div class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="mut">${cmbTxt(c)}</div></div><div style="text-align:right"><b>${money(c.price)}</b><div class="mut">costo ${money(cost)}</div></div></div>
  <div class="mut" style="margin-top:6px">Se pueden armar ${mx} · Ya armados en stock: ${k?stock(k):0} · Margen ${c.price>0?pc1((c.price-cost)/c.price*100):'—'}</div>
  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" onclick="asmForm('${c.id}')">Armar unidades</button><button class="btn sm ghost" onclick="cmbEdit('${c.id}')">Editar</button><button class="btn sm ghost" style="color:var(--bad)" onclick="cmbDel('${c.id}')">Eliminar</button></div></div>`}).join(''):'<div class="empty">Aún no tienes combos. Arma el primero aquí abajo.</div>')+
 `<h3>${cbid?'Editando combo':'Armar un combo nuevo'}</h3><div class="card">
 <label>Nombre del combo<input id="cbn" value="${esc(cbn)}" oninput="cbn=this.value" placeholder="Ej: Combo Día de la Madre"></label>
 <label>Agregar producto<select id="cbs">${D.products.filter(p=>!p.kit).map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.code)}</option>`).join('')}</select></label>
 <div class="r2"><label>Cantidad<input id="cbq" type="number" min="1" value="1"></label><button type="button" class="btn ghost" style="align-self:end;margin:0 0 10px" onclick="cmbAdd()">+ Agregar</button></div>
 <div id="cbl">${cmbItems()}</div>
 <label>Empaque especial del combo (S/)<input id="cbe" type="number" step="0.01" min="0" value="${cbe}" oninput="cbe=this.value;cmbCalcUI()"></label>
 <label>Margen que buscas (%)<input id="cbm" type="number" step="1" min="0" value="${cbm}" oninput="cbm=this.value;cmbCalcUI()"></label>
 <div class="presets">${[15,20,30,40,50].map(v=>`<button type="button" class="btn sm ghost" onclick="cbm='${v}';$('#cbm').value='${v}';cmbCalcUI()">${v}%</button>`).join('')}</div>
 <div id="cbr">${cmbRes()}</div>
 <label style="margin-top:10px">Precio final del combo (S/)<input id="cbp" type="number" step="0.01" min="0" value="${cbp}" oninput="cbp=this.value;cmbCalcUI()"></label>
 <button class="btn" onclick="cmbSave()">${cbid?'Guardar cambios':'Guardar combo'}</button>${cbid||cbi.length?`<button class="btn ghost" onclick="cmbReset()">Limpiar</button>`:''}</div>`}
function asmForm(id){const c=D.combos.find(x=>x.id===id);if(!c)return;const mx=cmbMax(c);
 modal(`<h2>Armar ${esc(c.name)}</h2><p class="mut">Cada unidad usa: ${cmbTxt(c)}. Esos productos salen del inventario (primero los que vencen antes) y quedan como combos ya armados, listos para vender.</p>
 <p>Con el stock actual se pueden armar hasta <b>${mx}</b>.</p>
 <form onsubmit="return doAsm(event,'${id}')"><label>¿Cuántas unidades armas?<input name="n" type="number" min="1" max="${mx}" required></label>
 <button class="btn" ${mx<1?'disabled':''}>Armar</button><button type="button" class="btn ghost" onclick="closeM()">Cancelar</button></form>`)}
function doAsm(e,cid){e.preventDefault();const f=new FormData(e.target),n=Math.round(+f.get('n')),c=D.combos.find(x=>x.id===cid);
 if(!c||!n||n<1)return false;if(n>cmbMax(c)){toast('Solo alcanza para '+cmbMax(c));return false}
 let cost=0,minExp='';
 c.items.forEach(it=>{const p=P(it.pid);let need=it.qty*n;
  for(const l of p.lots.filter(l=>l.qty>0&&(!l.exp||l.exp>=today())).sort(ord)){if(!need)break;const t=Math.min(l.qty,need);l.qty-=t;need-=t;cost+=t*l.cost;if(l.exp&&(!minExp||l.exp<minExp))minExp=l.exp}
  p.lots=p.lots.filter(l=>l.qty>0)});
 const uc=Math.round((cost/n+(+c.emp||0))*10000)/10000;
 if(!D.cats.includes('Combos'))D.cats.push('Combos');
 let k=D.products.find(p=>p.kit===cid);
 if(!k){let i=D.products.length+1,code;do{code='KIT-'+String(i++).padStart(4,'0')}while(D.products.some(p=>p.code===code));
  k={id:uid(),code,name:c.name,cat:'Combos',unit:'set',cost:uc,cbase:uc,price:c.price,min:1,lots:[],kit:cid};D.products.push(k)}
 k.cost=uc;k.cbase=uc;k.price=c.price;k.name=c.name;
 k.lots.push({id:uid(),date:today(),exp:minExp,qty:n,cost:uc,cbase:uc});
 D.moves.push(Object.assign(mv('armado',k,n,uc,0),{date:today(),note:c.name}));
 save();closeM();render();toast('Armaste '+n+' de '+c.name+' · costo '+money(uc)+' c/u',4500);return false}

/* ---------- Mermas ---------- */
function autoMerma(){let n=0;
 D.products.forEach(p=>{const dead=p.lots.filter(l=>l.qty>0&&l.exp&&l.exp<today());
  dead.forEach(l=>{const mid='am_'+l.id+'_'+l.qty;if(!D.moves.some(x=>x.id===mid)){D.moves.push(Object.assign(mv('merma',p,l.qty,l.cost,0),{id:mid,date:l.exp,reason:'Vencido',auto:1,lotDate:l.date,exp:l.exp}))}n++});
  if(dead.length)p.lots=p.lots.filter(l=>!dead.includes(l))});
 if(n)save();return n}
const reasonOpts=cur=>D.reasons.map(r=>`<option ${r===cur?'selected':''}>${esc(r)}</option>`).join('')+'<option value="__new">➕ Crear motivo nuevo…</option>';
function reasonSel(v){if(v!=='__new')return;const sel=$('#mr'),n=ask('Nombre del nuevo motivo (ej: textura rara)');
 if(!n){sel.value=D.reasons[0];return}
 let r=D.reasons.find(x=>x.toLowerCase()===n.toLowerCase());if(!r){r=n;D.reasons.push(r);save()}
 sel.innerHTML=reasonOpts(r);sel.value=r}
const lotOpts=p=>p.lots.slice().sort(ord).map(x=>`<option value="${x.id}">${lotTxt(x,p)}</option>`).join('');
function fillLots(id){$('#ml').innerHTML=lotOpts(P(id))}
function vMer(){
 const l=D.products.filter(p=>stock(p)>0);
 const ms=D.moves.filter(x=>x.type==='merma'&&inRange(x));
 const tl=ms.reduce((s,x)=>s+x.qty*x.cost,0),by={};
 ms.forEach(x=>{const r=x.reason||'Vencido';by[r]=by[r]||{n:0,t:0};by[r].n++;by[r].t+=x.qty*x.cost});
 return `<h2>Mermas</h2>`+(l.length?`<div class="card"><form onsubmit="return doMerma(event)">
  <b>Pasar producto a merma</b>
  <label style="margin-top:8px">Producto<select name="p" onchange="fillLots(this.value)">${opts(l,stock)}</select></label>
  <label>Lote<select name="l" id="ml">${lotOpts(l[0])}</select></label>
  <div class="r2"><label>Cantidad<input name="q" type="number" min="1" value="1" required></label>
  <label>Motivo<select name="r" id="mr" onchange="reasonSel(this.value)">${reasonOpts('')}</select></label></div>
  <label>Fecha de la merma<input name="d" type="date" min="2025-09-01" max="${today()}" value="${today()}" required></label>
  <label>Nota (opcional)<input name="t" placeholder="Ej: tono muy oscuro, tapa rota"></label>
  <button class="btn">Pasar a merma</button></form></div>`:`<div class="empty">No tienes stock para pasar a merma.</div>`)+
 `<p class="mut">Los lotes vencidos pasan solos a mermas con el motivo “Vencido”.</p>
 <select onchange="range=this.value;render()" style="margin:0 0 10px">${monthOpts()}</select>
 <div class="card"><div class="mut">Pérdida total por mermas</div><div class="big" style="color:var(--bad)">${money(tl)}</div></div>`+
 (ms.length?`<h3>Por motivo</h3>`+Object.entries(by).sort((a,b)=>b[1].t-a[1].t).map(([r,v])=>`<div class="card row"><div><b>${esc(r)}</b><div class="mut">${v.n} registro${v.n==1?'':'s'}</div></div><b>${money(v.t)}</b></div>`).join('')+
 `<h3>Detalle</h3>`+ms.slice().reverse().slice(0,30).map(x=>`<div class="card row"><div><b>${esc(x.name)}</b><div class="mut">${un(x.qty,x.unit||'unidad')} · ${fd(x.date)}${x.lotDate?' · lote del '+fd(x.lotDate):''}</div><div class="mut">${esc(x.reason||'Vencido')}${x.note?' · '+esc(x.note):''}</div></div><b style="color:var(--bad)">${money(x.qty*x.cost)}</b></div>`).join(''):'<div class="empty">Sin mermas en este período.</div>')}
function doMerma(e){e.preventDefault();const f=new FormData(e.target),p=P(f.get('p')),l=p&&p.lots.find(x=>x.id===f.get('l')),n=+f.get('q'),r=f.get('r');
 if(!l||!n)return false;if(r==='__new'){toast('Elige un motivo');return false}
 if(n>l.qty){toast('Ese lote solo tiene '+un(l.qty,p.unit));return false}
 l.qty-=n;p.lots=p.lots.filter(x=>x.qty>0);
 D.moves.push(Object.assign(mv('merma',p,n,l.cost,0),{date:f.get('d')||today(),reason:r,note:(f.get('t')||'').trim(),lotDate:l.date,exp:l.exp}));
 save();toast('Pasó a merma: '+un(n,p.unit)+' de '+p.name);render();return false}

/* ---------- Alertas (por lote) ---------- */
function alerts(){const v=[],s=[];
 D.products.forEach(p=>p.lots.forEach(l=>{const t=ls(l);if(l.qty>0&&t==='vencido')v.push({p,l});else if(l.qty>0&&t==='pronto')s.push({p,l})}));
 s.sort((a,b)=>ord(a.l,b.l));
 return{v,s,b:D.products.filter(p=>stock(p)<=(p.min??3))}}
function vAl(){const a=alerts();
 const blk=(t,l,f)=>l.length?`<h3>${t}</h3>`+l.map(f).join(''):'';
 const out=blk('Vencidos',a.v,({p,l})=>`<div class="card"><div class="row"><div><b>${esc(p.name)}</b> <span class="code">${esc(p.code)}</span><div class="mut">${lotTxt(l,p)}</div><div class="mut">Pérdida ${money(l.qty*l.cost)}</div></div>
  <button class="btn sm" onclick="baja('${p.id}','${l.id}')">Dar de baja</button></div></div>`)
 +blk('Vencen en 30 días o menos',a.s,({p,l})=>`<div class="card"><b>${esc(p.name)}</b> <span class="code">${esc(p.code)}</span><div class="mut">${lotTxt(l,p)} (en ${days(l.exp)} días)</div></div>`)
 +blk('Stock bajo',a.b,p=>`<div class="card"><b>${esc(p.name)}</b> <span class="code">${esc(p.code)}</span><div class="mut">Quedan ${un(stock(p),p.unit)} en total</div></div>`);
 return `<h2>Alertas</h2>`+(out||'<div class="empty">Todo en orden: nada vencido, por vencer ni con poco stock.</div>')}
function baja(pid,lid){const p=P(pid),l=p.lots.find(x=>x.id===lid);
 if(!confirm('¿Dar de baja '+un(l.qty,p.unit)+' de '+p.name+'?'))return;
 D.moves.push(mv('baja',p,l.qty,l.cost,0));p.lots=p.lots.filter(x=>x.id!==lid);save();render();toast('Lote dado de baja')}

/* ---------- Resumen ---------- */
function vSum(){
 const l=D.moves.filter(inRange);
 let sold=0,gain=0,buy=0,loss=0;
