<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salyn POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a2545">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fbf4f5;--card:#fff;--ink:#2e1a2b;--mut:#7d6a79;--pl:#4a2545;--rose:#c8456b;--ok:#2f7d5b;--warn:#b7791f;--bad:#c0392b;--line:#ecdde1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{background:var(--pl);color:#fff;padding:14px 16px}
header b{font:700 20px Georgia,serif}
main{padding:14px;max-width:640px;margin:auto}
h2{font:700 20px Georgia,serif;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:14px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.ok{background:#e3f3ec;color:var(--ok)}.pronto{background:#fbf0d9;color:var(--warn)}.vencido{background:#fbe3e0;color:var(--bad)}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}
input,select{display:block;width:100%;font:inherit;color:var(--ink);padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:#fff}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;font:600 16px inherit;font-family:inherit;padding:12px;border:0;border-radius:10px;background:var(--rose);color:#fff;margin-top:6px}
.btn.ghost{background:#fff;color:var(--pl);border:1px solid var(--line)}
.btn.sm{width:auto;padding:6px 12px;font-size:14px;margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;white-space:nowrap;border:0;background:none;padding:12px 11px;font:13px inherit;font-family:inherit;color:var(--mut)}
nav button.on{color:var(--rose);font-weight:700;box-shadow:inset 0 3px 0 var(--rose)}
#m{display:none;position:fixed;inset:0;background:rgba(46,26,43,.5);z-index:5;overflow:auto}
#m.on{display:block}
.sheet{background:var(--bg);margin:30px auto;max-width:520px;border-radius:14px;padding:16px;width:calc(100% - 24px)}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--pl);color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:9;font-size:15px;max-width:90%;text-align:center}
.big{font:700 22px Georgia,serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.lot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:14px;color:var(--mut)}
.code{font-family:ui-monospace,Menlo,monospace;background:#f3e6ea;color:var(--pl);padding:1px 6px;border-radius:6px;font-size:13px}
.pickbox{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 0 10px}
.pk{padding:10px;border-bottom:1px solid var(--line)}
.pk:last-child{border-bottom:0}
.pk.sel{background:#f9e3ea;box-shadow:inset 4px 0 0 var(--rose)}
</style></head><body>
<header><b>Salyn Store</b> <span class="mut" style="color:#e9c9d6">· Inventario y ventas</span><span id="stt" onclick="retrySave()" style="float:right;font-size:13px;color:#e9c9d6;cursor:pointer"></span></header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s);
const CATS=['Skincare','Maquillaje','Mascarillas','Cremas','Pestañas','Perfumes','Uñas','Cabello','Accesorios','Otros'];
const UN={unidad:['unidad','unidades'],docena:['docena','docenas'],decena:['decena','decenas'],set:['set','sets'],box:['box','boxes']};
const REASONS=['Mala pigmentación','Producto malo','No apto para venta','Envase dañado o roto'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const un=(n,u)=>n+' '+(UN[u]||UN.unidad)[n==1?0:1];
let D={products:[],moves:[],cats:CATS.slice(),payments:[]},tab='productos',range='mes',q='',fc='';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nextCode=()=>{const n=D.products.reduce((m,p)=>{const x=/^SAL-(\d+)$/.exec(p.code||'');return x?Math.max(m,+x[1]):m},0)+1;return'SAL-'+String(n).padStart(4,'0')};
/* Ordena datos viejos: lotes, categorías, códigos y unidades */
function migrate(){
 if(!D.cats||!D.cats.length)D.cats=CATS.slice();
 if(!D.reasons||!D.reasons.length)D.reasons=REASONS.slice();
 if(!D.payments)D.payments=[];
 if(!D.sales)D.sales=[];
 const yp=m=>/^Yape \d$/.test(m||'')?'Yape':m;
 D.moves.forEach(x=>{if(x.type==='out'&&!x.sid){x.sid=x.id;D.sales.push({id:x.id,date:x.date,method:yp(x.method)||'',paid:x.paid??x.qty*x.price,credit:!!x.credit,client:x.client||''})}});
 D.sales.forEach(z=>{z.method=yp(z.method)||''});D.payments.forEach(a=>{a.method=yp(a.method)});
 D.moves.forEach(x=>{if(x.type==='baja'){x.type='merma';x.reason=x.reason||'Vencido'}});
 D.products.forEach(p=>{
  if(!p.lots){p.lots=p.stock>0?[{id:uid(),date:'',exp:p.exp||'',qty:p.stock,cost:p.cost}]:[];delete p.stock;delete p.exp}
  if(!p.unit)p.unit='unidad';
  if(!p.code)p.code=nextCode();
  if(p.cat&&!D.cats.includes(p.cat))D.cats.push(p.cat);
 })}
migrate();
/* ---------- Nube (Firebase): entrar, guardar y sincronizar ---------- */
let user=null,ready=false,synced={},unsubs=[],syncErr='';
const COLS=['products','moves','sales','payments'];
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const blank=()=>({products:[],moves:[],cats:CATS.slice(),reasons:REASONS.slice(),payments:[],sales:[]});
function save(){
 if(!ready)return;const ops=[];
 COLS.forEach(c=>{const seen={};
  D[c].forEach(x=>{const k=c+'/'+x.id,j=canon(x);seen[k]=1;if(synced[k]!==j){synced[k]=j;ops.push({col:c,id:x.id,data:JSON.parse(j)})}});
  Object.keys(synced).forEach(k=>{if(k.startsWith(c+'/')&&!seen[k]){delete synced[k];ops.push({col:c,id:k.slice(c.length+1),del:true})}})});
 const m=canon({cats:D.cats,reasons:D.reasons});
 if(synced['config/main']!==m){synced['config/main']=m;ops.push({col:'config',id:'main',data:{cats:D.cats,reasons:D.reasons}})}
 if(ops.length)FB.write(ops).then(()=>{if(syncErr){syncErr='';updStatus()}}).catch(e=>{syncErr=e.code||e.message||'error';ops.forEach(o=>{delete synced[o.col+'/'+o.id]});updStatus();toast('⚠ No se guardó en la nube: '+syncErr,6000)})}
function retrySave(){if(!ready)return;syncErr='';save();updStatus();toast('Reintentando guardar…')}
function normalize(){COLS.forEach(c=>D[c].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0))}
function onSnap(col,snap){let ch=false;
 snap.docChanges().forEach(c=>{const id=c.doc.id,k=col+'/'+id;
  if(col==='config'){if(c.type!=='removed'){const d=c.doc.data();D.cats=d.cats||D.cats;D.reasons=d.reasons||D.reasons;synced[k]=canon({cats:D.cats,reasons:D.reasons});ch=true}return}
  if(c.type==='removed'){D[col]=D[col].filter(x=>x.id!==id);delete synced[k];ch=true}
  else{const d=c.doc.data();d.id=id;const i=D[col].findIndex(x=>x.id===id);if(i>=0)D[col][i]=d;else D[col].push(d);synced[k]=canon(d);ch=true}});
 if(ch){normalize();if(ready)softRender()}}
function softRender(){const a=document.activeElement;
 if($('#m').className==='on'||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName||'')))return;render()}
function updStatus(){const e=$('#stt');if(!ready){e.textContent='';return}
 e.textContent=syncErr?'⚠ No se guardó · toca para reintentar':(navigator.onLine?'● En línea':'● Sin internet (se guarda y sube al volver)')}
function showLogin(msg){$('#nav').style.display='none';$('#stt').textContent='';
 $('#v').innerHTML=`<h2>Entrar</h2><div class="card"><form onsubmit="return doLogin(event)">
 <label>Correo<input name="e" type="email" required autocomplete="username" value="salyn0store@gmail.com"></label>
 <label>Contraseña<input name="p" type="password" required autocomplete="current-password"></label>
 <button class="btn">Entrar</button></form>${msg?`<p style="color:var(--bad)">${esc(msg)}</p>`:''}</div>`}
const authMsg=e=>({'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin internet. Revisa tu conexión.'})[e.code]||'No se pudo entrar: '+(e.code||e.message);
async function doLogin(e){e.preventDefault();const f=new FormData(e.target);
 try{await FB.login(f.get('e').trim(),f.get('p'))}catch(err){showLogin(authMsg(err))}return false}
function stopSync(){unsubs.forEach(f=>f());unsubs=[];ready=false;synced={};D=blank();cart=[];pd={}}
async function startSync(){
 $('#v').innerHTML='<div class="empty">Cargando tus datos…</div>';
 stopSync();
 const firsts=[...COLS,'config'].map(col=>new Promise(res=>{let done=false;
  unsubs.push(FB.listen(col,snap=>{onSnap(col,snap);if(!done&&(!snap.metadata.fromCache||!navigator.onLine||snap.size>0)){done=true;res()}},
   err=>{res();toast('No se pudo leer '+col+': '+(err.code||''))}))}));
 await Promise.race([Promise.all(firsts),new Promise(r=>setTimeout(r,8000))]);
 normalize();
 if(!synced['config/main'])synced['config/main']=canon({cats:D.cats,reasons:D.reasons});
 ready=true;$('#nav').style.display='flex';updStatus();
 const loc=localStorage.getItem('salynpos');
 if(loc&&!D.products.length&&!D.moves.length){try{const d=JSON.parse(loc);if(d.products&&d.products.length)offerImport(d)}catch(e){}}
 migrate();save();render()}
function offerImport(d){
 modal(`<h2>Encontré datos en este aparato</h2><p>Hay ${d.products.length} producto(s) y ${(d.moves||[]).length} movimiento(s) guardados solo aquí. ¿Los subo a la nube para verlos en todos tus aparatos?</p>
 <button class="btn" onclick="doImport()">Sí, subirlos</button><button class="btn ghost" onclick="closeM()">No, empezar vacío</button>`);window._imp=d}
function doImport(){D=window._imp;migrate();save();try{localStorage.setItem('salynpos_subido',localStorage.getItem('salynpos'));localStorage.removeItem('salynpos')}catch(e){}
 closeM();render();toast('Datos subidos a la nube')}
function boot(){FB.onAuth(u=>{if(u){user=u;startSync()}else{stopSync();showLogin()}})}
/* ---------- Exportar a Excel ---------- */
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res();const t=document.createElement('script');
 t.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';t.onload=res;t.onerror=()=>rej(new Error('x'));document.head.appendChild(t)})}
async function exportXlsx(){
 try{await loadXlsx()}catch(e){toast('No se pudo cargar el exportador. Revisa tu internet.');return}
 const W=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(W,XLSX.utils.json_to_sheet(r.length?r:[{'(sin datos)':''}]),n);
 add('Productos',D.products.map(p=>({'Código':p.code,Producto:p.name,'Categoría':p.cat,'Presentación':p.unit,Costo:p.cost,'Precio venta':p.price,Stock:stock(p),'Avisar si quedan ≤':p.min})));
 add('Lotes',D.products.flatMap(p=>p.lots.map(l=>({'Código':p.code,Producto:p.name,Cantidad:l.qty,'Costo por unidad':l.cost,'Fecha entrega':l.date,Vencimiento:l.exp}))));
 add('Ventas',D.sales.map(z=>({Fecha:z.date,Cliente:z.client,'Forma de pago':z.method||'Sin dato',Productos:sLines(z.id).map(x=>x.name+' ×'+x.qty).join(', '),Total:saleTotal(z.id),'Pagó al vender':z.paid,'A crédito':z.credit?'Sí':'No'})));
 add('Detalle ventas',D.moves.filter(x=>x.type==='out').map(x=>({Fecha:x.date,Producto:x.name,Cantidad:x.qty,Precio:x.price,Costo:x.cost,Ganancia:x.qty*(x.price-x.cost)})));
 add('Pagos de deudas',D.payments.map(a=>{const z=S(a.mid);return{Fecha:a.date,Cliente:z?z.client:'',Monto:a.amount,'Forma de pago':a.method}}));
 add('Entradas',D.moves.filter(x=>x.type==='in').map(x=>({Fecha:x.date,Producto:x.name,Cantidad:x.qty,Costo:x.cost})));
 add('Mermas',D.moves.filter(x=>x.type==='merma').map(x=>({Fecha:x.date,Producto:x.name,Cantidad:x.qty,Costo:x.cost,'Pérdida':x.qty*x.cost,Motivo:x.reason||'Vencido',Nota:x.note||''})));
 XLSX.writeFile(W,'salyn-pos-'+today()+'.xlsx')}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'S/ '+(+n||0).toFixed(2);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
range=today().slice(0,7);
let cart=[],pd={},vsq='',vsel='';
const fd=d=>d?d.split('-').reverse().join('/'):'';
const days=e=>Math.round((new Date(e+'T00:00')-new Date(today()+'T00:00'))/864e5);
const P=id=>D.products.find(x=>x.id===id);
const mv=(type,p,qty,cost,price)=>({id:uid(),date:today(),type,pid:p.id,name:p.name,unit:p.unit,qty,cost,price});
const ord=(a,b)=>(a.exp||'9999')<(b.exp||'9999')?-1:(a.exp||'9999')>(b.exp||'9999')?1:(a.date||'')<(b.date||'')?-1:1;
const stock=p=>p.lots.reduce((s,l)=>s+l.qty,0);
const sellable=p=>p.lots.filter(l=>!l.exp||l.exp>=today()).reduce((s,l)=>s+l.qty,0);
function ls(l){if(!l.exp)return'ok';const d=days(l.exp);return d<0?'vencido':d<=30?'pronto':'ok'}
function st(p){const s=p.lots.map(ls);return s.includes('vencido')?'vencido':s.includes('pronto')?'pronto':'ok'}
function nextExp(p){const l=p.lots.filter(l=>l.exp).sort(ord)[0];return l?l.exp:''}
function toast(s,ms){const t=$('#t');t.textContent=s;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',ms||2600)}
function modal(h){$('#m').innerHTML='<div class="sheet">'+h+'</div>';$('#m').className='on'}
function closeM(){$('#m').className=''}
function go(t){tab=t;render()}
const opts=(list,f)=>list.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.code} (${un(f(p),p.unit)})</option>`).join('');
const lotTxt=(l,p)=>`${un(l.qty,p.unit)} · entró ${l.date?fd(l.date):'sin fecha'} · ${l.exp?'vence '+fd(l.exp):'sin vencimiento'}`;
const catOpts=cur=>D.cats.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new">➕ Crear categoría nueva…</option>';
const unitOpts=cur=>Object.keys(UN).map(u=>`<option value="${u}" ${u===cur?'selected':''}>${cap(u)}</option>`).join('');

/* ---------- Categorías ---------- */
function ask(t,d){return(prompt(t,d||'')||'').trim()}
function catSel(v){if(v!=='__new')return;const sel=$('#cs'),n=ask('Nombre de la nueva categoría');
 if(!n){sel.value=D.cats[0]||'';return}
 let c=D.cats.find(x=>x.toLowerCase()===n.toLowerCase());if(!c){c=n;D.cats.push(c);save()}
 sel.innerHTML=catOpts(c);sel.value=c}
function catForm(){modal(`<h2>Categorías</h2>`+D.cats.map((c,i)=>{const n=D.products.filter(p=>p.cat===c).length;
 return `<div class="card row"><div><b>${esc(c)}</b><div class="mut">${n} producto${n==1?'':'s'}</div></div>
 <div style="display:flex;gap:6px"><button class="btn sm ghost" onclick="renCat(${i})">Renombrar</button>${n?'':`<button class="btn sm ghost" onclick="delCat(${i})">Quitar</button>`}</div></div>`}).join('')+
 `<button class="btn" onclick="addCat()">+ Nueva categoría</button><button class="btn ghost" onclick="closeM()">Cerrar</button>`)}
function addCat(){const n=ask('Nombre de la nueva categoría');if(!n)return;
 if(D.cats.some(c=>c.toLowerCase()===n.toLowerCase()))return toast('Esa categoría ya existe');
 D.cats.push(n);save();catForm();render()}
function renCat(i){const o=D.cats[i],n=ask('Nuevo nombre',o);if(!n||n===o)return;
 if(D.cats.some((c,j)=>j!==i&&c.toLowerCase()===n.toLowerCase()))return toast('Esa categoría ya existe');
 D.cats[i]=n;D.products.forEach(p=>{if(p.cat===o)p.cat=n});if(fc===o)fc=n;save();catForm();render()}
function delCat(i){if(D.cats.length<2)return toast('Debe quedar al menos una categoría');
 if(confirm('¿Quitar la categoría '+D.cats[i]+'?')){if(fc===D.cats[i])fc='';D.cats.splice(i,1);save();catForm();render()}}

/* ---------- Productos ---------- */
function vProd(){
  const ql=q.toLowerCase(),l=D.products.filter(p=>(p.name.toLowerCase().includes(ql)||p.code.toLowerCase().includes(ql))&&(!fc||p.cat===fc));
  return `<h2>Productos</h2>
  <input placeholder="Buscar por nombre o código" value="${esc(q)}" oninput="q=this.value;render(true)" id="s">
  <div class="r2" style="margin-top:10px">
   <select onchange="fc=this.value;render()" style="margin:0"><option value="">Todas las categorías</option>${D.cats.map(c=>`<option ${c===fc?'selected':''}>${esc(c)}</option>`).join('')}</select>
   <button class="btn ghost" style="margin:0;padding:10px" onclick="catForm()">Editar categorías</button></div>
  <button class="btn" onclick="pForm('')" style="margin:10px 0 12px">+ Nuevo producto</button>`+
  (l.length?l.map(p=>{const s=st(p),ne=nextExp(p);return `<div class="card" onclick="pForm('${p.id}')">
    <div class="row"><b>${esc(p.name)}</b><span class="pill ${s}">${s==='vencido'?'Tiene vencidos':s==='pronto'?'Vence '+fd(ne):'Stock '+un(stock(p),p.unit)}</span></div>
    <div class="mut"><span class="code">${esc(p.code)}</span> · ${esc(p.cat)} · Stock total ${un(stock(p),p.unit)}</div>
    <div class="mut">Costo ${money(p.cost)} · Venta ${money(p.price)} por ${p.unit} · Ganas ${money(p.price-p.cost)}</div>
    ${p.lots.slice().sort(ord).map(x=>`<div class="lot"><span>${lotTxt(x,p)}</span><span class="pill ${ls(x)}">${ls(x)==='vencido'?'Vencido':ls(x)==='pronto'?'Por vencer':'Bien'}</span></div>`).join('')}</div>`}).join(''):
  `<div class="empty">${D.products.length?'No encontré productos con ese filtro.':'Aún no tienes productos. Toca “+ Nuevo producto” para empezar.'}</div>`);
}
function pForm(id){const p=P(id)||{};
 modal(`<h2>${id?'Editar producto':'Nuevo producto'}</h2><form onsubmit="return savP(event,'${id}')">
 <label>Nombre<input name="n" required value="${esc(p.name||'')}"></label>
 <div class="r2"><label>Código único<input name="k" required value="${esc(p.code||nextCode())}"></label>
 <label>Se maneja por<select name="u">${unitOpts(p.unit||'unidad')}</select></label></div>
 <label>Categoría<select name="c" id="cs" onchange="catSel(this.value)">${catOpts(p.cat)}</select></label>
 <div class="r2"><label>Costo (S/) por presentación<input name="co" type="number" step="0.01" min="0" required value="${p.cost??''}"></label>
 <label>Precio de venta (S/)<input name="pr" type="number" step="0.01" min="0" required value="${p.price??''}"></label></div>
 <label>Avisar si quedan ≤<input name="mn" type="number" min="0" value="${p.min??3}"></label>
 <p class="mut" style="margin-top:-4px">El stock, el costo y el precio se cuentan en la presentación elegida (unidad, docena, decena, set o box).</p>
 ${id?'':`<h3>Primer lote (opcional)</h3>
 <div class="r2"><label>Cantidad<input name="st" type="number" min="0" value="0"></label>
 <label>Fecha de entrega<input name="de" type="date" min="2025-09-01" max="${today()}" value="${today()}"></label></div>
 <label>Fecha de vencimiento<input name="ex" type="date"></label>`}
 ${id&&p.lots.length?`<h3>Lotes (para corregir errores)</h3>`+p.lots.slice().sort(ord).map(x=>`<div class="lot"><span>${lotTxt(x,p)}</span><button type="button" class="btn sm ghost" onclick="delLot('${id}','${x.id}')">Quitar</button></div>`).join(''):''}
 <button class="btn" style="margin-top:14px">Guardar</button>
 ${id?`<button type="button" class="btn ghost" onclick="delP('${id}')">Eliminar producto</button>`:''}
 <button type="button" class="btn ghost" onclick="closeM()">Cancelar</button></form>`)}
function savP(e,id){e.preventDefault();const f=new FormData(e.target),code=f.get('k').trim();
 if(D.products.some(x=>x.id!==id&&x.code.toLowerCase()===code.toLowerCase())){toast('Ese código ya lo tiene otro producto');return false}
 if(f.get('c')==='__new'){toast('Elige una categoría');return false}

 else{o.id=uid();o.lots=[];const n=+f.get('st')||0;

function delLot(pid,lid){if(!confirm('¿Quitar este lote del inventario? (No cuenta como venta ni pérdida)'))return;

/* ---------- Entrada (crea un lote nuevo) ---------- */
function vIn(){

  <div class="r2"><label>Fecha de entrega<input name="d" type="date" min="2025-09-01" max="${today()}" required value="${today()}"></label>
  <label>Fecha de vencimiento<input name="x" type="date"></label></div>
  <button class="btn">Registrar lote</button></form></div>

function doIn(e){e.preventDefault();const f=new FormData(e.target),p=P(f.get('p')),n=+f.get('q'),c=+f.get('c');

/* ---------- Vender (varios productos; sale primero el lote que vence antes) ---------- */
const S=id=>D.sales.find(x=>x.id===id);
const sLines=sid=>D.moves.filter(x=>x.type==='out'&&x.sid===sid);
const saleTotal=sid=>sLines(sid).reduce((t,x)=>t+x.qty*x.price,0);
const lineTxt=sid=>sLines(sid).map(x=>esc(x.name)+' ×'+x.qty).join(', ');
const cartQty=pid=>cart.filter(c=>c.pid===pid).reduce((t,c)=>t+c.qty,0);
const cartTotal=()=>cart.reduce((t,c)=>t+c.qty*c.price,0);
function payTxt(){if(!pd.cr)return'';const t=cartTotal(),pg=+pd.pg||0;return'Pagó '+money(Math.min(pg,t))+' · Debe '+money(Math.max(t-pg,0))}
function savePd(form){const f=new FormData(form);pd={d:f.get('d'),m:f.get('m'),cr:f.get('cr')==='on',cl:f.get('cl')||'',pg:f.get('pg')||'0'}}
function saleCard(z){return `<div class="card" onclick="saleForm('${z.id}')"><div class="row"><div><b>${fd(z.date)}${z.client?' · '+esc(z.client):''}</b><div class="mut">${lineTxt(z.id)}</div></div>
 <div style="text-align:right"><b>${money(saleTotal(z.id))}</b><div class="mut">${z.method||'Sin dato'}${z.credit?' · fiado':''}</div></div></div></div>`}
function vSell(){
  const all=D.products.filter(p=>sellable(p)-cartQty(p.id)>0),l=pickList(),p=l.find(x=>x.id===vsel)||l[0],pu=p?p.unit:'unidad',pr=p?p.price:'';vsel=p?p.id:'';
  const rec=D.sales.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.id<b.id?1:-1).slice(0,15);
  const add=all.length?`<div class="card"><form onsubmit="return addCart(event)"><b>Agregar producto</b>
  <input id="vs" placeholder="Buscar producto por nombre o código" value="${esc(vsq)}" oninput="vsq=this.value;renderPick()" autocomplete="off" style="margin:8px 0">
  <div class="pickbox" id="pk">${pickHTML(l)}</div><input type="hidden" name="p" id="pp" value="${vsel}">
  <div class="r2"><label>Cantidad (<span id="su">${UN[pu][1]}</span>)<input name="q" id="sq" type="number" min="1" value="1" required oninput="sub()"></label>
  <label>Precio (S/) por <span id="su2">${pu}</span><input name="c" id="sp" type="number" step="0.01" min="0" required value="${pr}" oninput="sub()"></label></div>
  <div class="mut" style="margin-bottom:6px">Subtotal: <b id="sb">${money(pr||0)}</b></div>
  <button class="btn ghost">+ Agregar a la venta</button></form></div>`
  :`<div class="empty">${cart.length?'Ya agregaste todo el stock disponible.':'No tienes productos disponibles para vender. Registra una entrada o revisa Alertas.'}</div>`;
  const cartH=cart.length?`<div class="card"><b>Venta actual</b>`+cart.map((c,i)=>{const q=P(c.pid);
   return `<div class="lot"><span>${esc(q?q.name:'?')} · ${un(c.qty,q?q.unit:'unidad')} × ${money(c.price)}</span><span><b>${money(c.qty*c.price)}</b> <button class="btn sm ghost" onclick="rmCart(${i})">Quitar</button></span></div>`}).join('')+
  `<form onsubmit="return doSell(event)" onchange="savePd(this)" oninput="savePd(this)" style="margin-top:12px">
  <label>Fecha de la venta<input name="d" type="date" min="2025-09-01" max="${today()}" value="${pd.d||today()}" required></label>
  <label>Forma de pago<select name="m">${METHODS.map(m=>`<option ${m===pd.m?'selected':''}>${m}</option>`).join('')}</select></label>
  <label style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:16px"><input type="checkbox" name="cr" id="cr" style="width:auto;margin:0" onchange="tot()" ${pd.cr?'checked':''}> Venta a crédito (fiado)</label>
  <div id="crb" style="display:${pd.cr?'block':'none'}"><label>Cliente que debe<input name="cl" value="${esc(pd.cl||'')}" placeholder="Nombre"></label>
  <label>Pagó ahora (S/)<input name="pg" id="pg" type="number" step="0.01" min="0" value="${pd.pg||0}" oninput="tot()"></label></div>
  <div class="big" id="tt">${money(cartTotal())}</div><div class="mut" id="dd">${payTxt()}</div><div class="mut" style="margin-bottom:8px">Total de la venta</div>
  <button class="btn">Registrar venta</button><button type="button" class="btn ghost" onclick="cart=[];pd={};render()">Vaciar venta</button></form></div>`:'';
  return `<h2>Vender</h2>`+add+cartH+`<p class="mut">Se vende primero el lote que vence antes. Los lotes vencidos no se pueden vender.</p>`+
   (rec.length?`<h3>Ventas recientes (toca una para corregirla o anularla)</h3>`+rec.map(saleCard).join(''):'')}
function pickList(){const q=vsq.toLowerCase();
 return D.products.filter(p=>sellable(p)-cartQty(p.id)>0&&(!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)))}
function pickHTML(l){return l.length?l.map(p=>`<div class="pk ${p.id===vsel?'sel':''}" onclick="pickP('${p.id}')"><div class="row"><b>${esc(p.name)}</b><span class="code">${esc(p.code)}</span></div><div class="mut">${un(sellable(p)-cartQty(p.id),p.unit)} disponibles · ${money(p.price)}</div></div>`).join(''):'<div class="empty" style="padding:12px">No encontré ese producto.</div>'}
function renderPick(force){const l=pickList(),changed=!l.some(p=>p.id===vsel);
 if(changed)vsel=l.length?l[0].id:'';
 $('#pk').innerHTML=pickHTML(l);$('#pp').value=vsel;
 if(vsel&&(changed||force))fillSell(vsel)}
function pickP(id){vsel=id;renderPick(true)}
function fillSell(id){const p=P(id);$('#sp').value=p.price;$('#su').textContent=UN[p.unit][1];$('#su2').textContent=p.unit;sub()}
function sub(){$('#sb').textContent=money($('#sq').value*$('#sp').value)}
function tot(){const t=cartTotal(),cr=$('#cr').checked,pg=+$('#pg').value||0;
 $('#crb').style.display=cr?'block':'none';$('#tt').textContent=money(t);
 $('#dd').textContent=cr?'Pagó '+money(Math.min(pg,t))+' · Debe '+money(Math.max(t-pg,0)):''}
function addCart(e){e.preventDefault();const f=new FormData(e.target),p=P(f.get('p')),n=+f.get('q'),c=+f.get('c');
 if(!p){toast('Toca un producto de la lista para elegirlo');return false}if(!n)return false;const av=sellable(p)-cartQty(p.id);
 if(n>av){toast('Solo puedes agregar '+un(av,p.unit)+' de '+p.name+' (los vencidos no cuentan)');return false}
 cart.push({pid:p.id,qty:n,price:c});vsq='';vsel='';render();return false}
function rmCart(i){cart.splice(i,1);render()}
function doSell(e){e.preventDefault();const f=new FormData(e.target);
 const cr=f.get('cr')==='on',cl=(f.get('cl')||'').trim(),dt=f.get('d')||today();
 if(!cart.length)return false;
 if(dt<'2025-09-01'||dt>today()){toast('La fecha debe ser desde el 01/09/2025 hasta hoy');return false}
 if(cr&&!cl){toast('Escribe el nombre del cliente que debe');return false}
 for(const c of cart){const p=P(c.pid);if(!p||cartQty(c.pid)>sellable(p)){toast('Ya no hay stock suficiente de '+(p?p.name:'un producto'));return false}}
 const sid=uid(),total=cartTotal();
 cart.forEach(c=>{const p=P(c.pid);let need=c.qty,cost=0;const used=[];
  for(const l of p.lots.filter(l=>l.qty>0&&(!l.exp||l.exp>=today())).sort(ord)){if(!need)break;const t=Math.min(l.qty,need);l.qty-=t;need-=t;cost+=t*l.cost;used.push({id:l.id,date:l.date,exp:l.exp,cost:l.cost,qty:t})}
  p.lots=p.lots.filter(l=>l.qty>0);
  D.moves.push(Object.assign(mv('out',p,c.qty,cost/c.qty,c.price),{date:dt,sid,lots:used}))});
 const paid=cr?Math.min(Math.max(+f.get('pg')||0,0),total):total,debe=total-paid;
 D.sales.push({id:sid,date:dt,method:f.get('m'),paid,credit:cr&&debe>0.005,client:cl});
 const rest=[...new Set(cart.map(c=>c.pid))].map(id=>{const q=P(id);return q?q.name+': quedan '+un(stock(q),q.unit):''}).filter(Boolean).join(' · ');
 cart=[];pd={};vsq='';vsel='';save();toast((debe>0.005?'Venta a crédito: debe '+money(debe):'Venta registrada: '+money(total))+' — Inventario descontado ('+rest+')',6000);render();return false}
function saleForm(id){const z=S(id);if(!z)return;const ab=D.payments.filter(a=>a.mid===id);
 modal(`<h2>Venta del ${fd(z.date)}</h2>`+sLines(id).map(x=>`<div class="lot"><span>${esc(x.name)} · ${un(x.qty,x.unit||'unidad')} × ${money(x.price)}</span><b>${money(x.qty*x.price)}</b></div>`).join('')+
 `<div class="row" style="margin:8px 0"><b>Total</b><b>${money(saleTotal(id))}</b></div>
 <div class="mut">Pagó al vender: ${money(z.paid)}${ab.length?' · Pagos posteriores: '+money(ab.reduce((t,a)=>t+a.amount,0)):''}</div>
 <h3>Corregir datos</h3><form onsubmit="return editSale(event,'${id}')">
 <div class="r2"><label>Fecha<input name="d" type="date" min="2025-09-01" max="${today()}" value="${z.date}" required></label>
 <label>Forma de pago<select name="m">${METHODS.map(m=>`<option ${m===z.method?'selected':''}>${m}</option>`).join('')}</select></label></div>
 <label>Cliente<input name="cl" value="${esc(z.client||'')}" placeholder="Nombre (obligatorio si es fiado)"></label>
 <button class="btn">Guardar cambios</button></form>
 <button class="btn ghost" style="color:var(--bad)" onclick="voidSale('${id}')">Anular venta</button>
 <button class="btn ghost" onclick="closeM()">Cerrar</button>
 <p class="mut">Si te equivocaste de producto, cantidad o precio: anula la venta (el stock vuelve a su lote) y regístrala de nuevo.</p>`)}
function editSale(e,id){e.preventDefault();const f=new FormData(e.target),z=S(id),dt=f.get('d'),cl=(f.get('cl')||'').trim();
 if(dt<'2025-09-01'||dt>today()){toast('La fecha debe ser desde el 01/09/2025 hasta hoy');return false}
 if(z.credit&&!cl){toast('Escribe el nombre del cliente que debe');return false}
 z.date=dt;z.method=f.get('m');z.client=cl;sLines(id).forEach(x=>x.date=dt);save();closeM();render();toast('Venta corregida');return false}
function voidSale(id){const ab=D.payments.filter(a=>a.mid===id).length;
 if(!confirm('¿Anular esta venta? El stock vuelve a su lote'+(ab?' y se borran sus '+ab+' pago(s) de deuda':'')+'.'))return;
 sLines(id).forEach(x=>{const p=P(x.pid);if(!p)return;
  if(x.lots&&x.lots.length)x.lots.forEach(c=>{const l=p.lots.find(z=>z.id===c.id);if(l)l.qty+=c.qty;else p.lots.push({id:c.id,date:c.date,exp:c.exp,qty:c.qty,cost:c.cost})});
  else p.lots.push({id:uid(),date:'',exp:'',qty:x.qty,cost:x.cost})});
 D.moves=D.moves.filter(x=>!(x.type==='out'&&x.sid===id));D.sales=D.sales.filter(z=>z.id!==id);D.payments=D.payments.filter(a=>a.mid!==id);
 save();closeM();render();toast('Venta anulada')}

/* ---------- Meses y Deudas ---------- */
const METHODS=['Efectivo','Yape','Transferencia'];
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const inRange=x=>range==='todo'?x.date>='2025-09-01':x.date.slice(0,7)===range;
function monthOpts(){const [cy,cm]=today().slice(0,7).split('-').map(Number);let y=2025,m=9;const l=[];
 while(y<cy||(y===cy&&m<=cm)){l.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}
 return [['todo','Todo (desde 01/09/2025)']].concat(l.reverse().map(k=>[k,MES[+k.slice(5)-1]+' '+k.slice(0,4)]))
  .map(([k,t])=>`<option value="${k}" ${k===range?'selected':''}>${t}</option>`).join('')}
function debts(){return D.sales.filter(z=>z.credit).map(z=>{const t=saleTotal(z.id),ab=D.payments.filter(a=>a.mid===z.id).reduce((q,a)=>q+a.amount,0),pag=z.paid+ab;
 return{s:z,t,pag,debe:Math.round((t-pag)*100)/100}}).filter(d=>d.debe>0.005).sort((a,b)=>a.s.date<b.s.date?-1:1)}
function vDeu(){const l=debts(),tt=l.reduce((q,d)=>q+d.debe,0);
 return `<h2>Deudas</h2><div class="card"><div class="mut">Total por cobrar</div><div class="big" style="color:var(--warn)">${money(tt)}</div></div>`+
 (l.length?l.map(d=>`<div class="card"><div class="row"><div><b>${esc(d.s.client||'Sin nombre')}</b>
  <div class="mut">${lineTxt(d.s.id)} · ${fd(d.s.date)}</div>
  <div class="mut">Total ${money(d.t)} · Pagó ${money(d.pag)}</div></div>
  <div style="text-align:right"><div class="big" style="color:var(--bad)">${money(d.debe)}</div><button class="btn sm" style="margin-top:6px" onclick="payForm('${d.s.id}')">Cobrar</button></div></div></div>`).join(''):`<div class="empty">Nadie te debe nada.</div>`)}
function payForm(id){const d=debts().find(z=>z.s.id===id);if(!d)return;const hist=D.payments.filter(a=>a.mid===id);
 modal(`<h2>Cobrar a ${esc(d.s.client)}</h2><p class="mut">${lineTxt(id)} · Debe ${money(d.debe)}</p>
 <form onsubmit="return doPay(event,'${id}')">
 <div class="r2"><label>Monto (S/)<input name="a" type="number" step="0.01" min="0.01" max="${d.debe}" required value="${d.debe}"></label>
 <label>Forma de pago<select name="m">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></label></div>
 <label>Fecha del pago<input name="d" type="date" min="2025-09-01" max="${today()}" value="${today()}" required></label>
 ${hist.length?`<h3>Pagos anteriores</h3>`+hist.map(a=>`<div class="lot"><span>${fd(a.date)} · ${a.method}</span><b>${money(a.amount)}</b></div>`).join(''):''}
 <button class="btn" style="margin-top:12px">Registrar pago</button><button type="button" class="btn ghost" onclick="closeM()">Cancelar</button></form>`)}
function doPay(e,id){e.preventDefault();const f=new FormData(e.target),d=debts().find(z=>z.s.id===id),a=Math.round(+f.get('a')*100)/100,dt=f.get('d');
 if(!d)return false;if(a<=0||a>d.debe+0.005){toast('El monto no puede pasar de '+money(d.debe));return false}
 if(dt<'2025-09-01'||dt>today()){toast('La fecha debe ser desde el 01/09/2025 hasta hoy');return false}
 D.payments.push({id:uid(),mid:id,date:dt,amount:a,method:f.get('m')});save();closeM();render();toast('Pago registrado: '+money(a));return false}

/* ---------- Todas las ventas ---------- */
let vq='',vmt='',vst='',vlim=50;
function saleDebe(z){if(!z.credit)return 0;const ab=D.payments.filter(a=>a.mid===z.id).reduce((t,a)=>t+a.amount,0);return Math.max(Math.round((saleTotal(z.id)-z.paid-ab)*100)/100,0)}
function venFiltered(){const q=vq.toLowerCase();
 return D.sales.filter(z=>inRange(z)&&(!vmt||(z.method||'Sin dato')===vmt)&&(!vst||(vst==='deuda'?saleDebe(z)>0.005:saleDebe(z)<=0.005))&&
  (!q||(z.client||'').toLowerCase().includes(q)||sLines(z.id).some(x=>x.name.toLowerCase().includes(q))))
  .sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:a.id<b.id?1:-1)}
function venCard(z){const d=saleDebe(z),t=saleTotal(z.id);
 return `<div class="card" onclick="saleForm('${z.id}')"><div class="row"><div><b>${fd(z.date)}${z.client?' · '+esc(z.client):''}</b><div class="mut">${lineTxt(z.id)}</div><div class="mut">${z.method||'Sin dato'}${z.credit?' · a crédito':''}</div></div>
 <div style="text-align:right"><b>${money(t)}</b>${d>0.005?`<div><span class="pill pronto">Debe ${money(d)}</span></div>`:(z.credit?'<div><span class="pill ok">Pagada</span></div>':'')}</div></div></div>`}
function venBody(){const l=venFiltered(),tot=l.reduce((t,z)=>t+saleTotal(z.id),0),deb=l.reduce((t,z)=>t+saleDebe(z),0);
 return `<div class="grid"><div class="card"><div class="mut">Ventas</div><div class="big">${l.length}</div></div><div class="card"><div class="mut">Total vendido</div><div class="big">${money(tot)}</div></div>
 <div class="card"><div class="mut">Cobrado</div><div class="big" style="color:var(--ok)">${money(tot-deb)}</div></div><div class="card"><div class="mut">Por cobrar</div><div class="big" style="color:var(--warn)">${money(deb)}</div></div></div>`+
 (l.length?l.slice(0,vlim).map(venCard).join('')+(l.length>vlim?`<button class="btn ghost" onclick="vlim+=50;$('#vb').innerHTML=venBody()">Ver más (${l.length-vlim} restantes)</button>`:''):'<div class="empty">No hay ventas con estos filtros.</div>')}
function vVen(){return `<h2>Todas las ventas</h2>
 <select onchange="range=this.value;vlim=50;render()" style="margin:0 0 10px">${monthOpts()}</select>
 <input id="vqs" placeholder="Buscar por cliente o producto" value="${esc(vq)}" oninput="vq=this.value;vlim=50;$('#vb').innerHTML=venBody()" autocomplete="off" style="margin-bottom:10px">
 <div class="r2" style="margin-bottom:10px"><select onchange="vmt=this.value;vlim=50;$('#vb').innerHTML=venBody()" style="margin:0"><option value="">Todas las formas de pago</option>${METHODS.concat(['Sin dato']).map(m=>`<option ${m===vmt?'selected':''}>${m}</option>`).join('')}</select>
 <select onchange="vst=this.value;vlim=50;$('#vb').innerHTML=venBody()" style="margin:0"><option value="">Con o sin deuda</option><option value="deuda" ${vst==='deuda'?'selected':''}>Con deuda pendiente</option><option value="pagada" ${vst==='pagada'?'selected':''}>Sin deuda</option></select></div>
 <div id="vb">${venBody()}</div><p class="mut">Toca una venta para ver el detalle, corregirla o anularla.</p>`}

/* ---------- Mermas ---------- */
function autoMerma(){let n=0;
 D.products.forEach(p=>{const dead=p.lots.filter(l=>l.qty>0&&l.exp&&l.exp<today());
  dead.forEach(l=>{const mid='am_'+l.id+'_'+l.qty;if(!D.moves.some(x=>x.id===mid)){D.moves.push(Object.assign(mv('merma',p,l.qty,l.cost,0),{id:mid,date:l.exp,reason:'Vencido',auto:1,lotDate:l.date,exp:l.exp}))}n++});
  if(dead.length)p.lots=p.lots.filter(l=>!dead.includes(l))});
 if(n)save();return n}
const reasonOpts=cur=>D.reasons.map(r=>`<option ${r===cur?'selected':''}>${esc(r)}</option>`).join('')+'<option value="__new">➕ Crear motivo nuevo…</option>';

 `<p class="mut">Los lotes vencidos pasan solos a mermas con el motivo “Vencido”.</p>
